name: Check

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: make

      - name: Format
        run: make test-format

      # Compiles RDKit and the Smarter SMARTS wasm in docker, then builds the site.
      - name: Build
        run: make build
